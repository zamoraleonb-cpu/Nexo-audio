<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nexo Video Kit</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            background: white;
        }

        .boton {
            width: 100%;
            height: 50vh;
            border: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            color: white;
            font-weight: bold;
            padding: 20px;
        }

        .audio {
            background: #111111;
        }

        .web {
            background: #555555;
        }

        .icono {
            font-size: 70px;
            margin-bottom: 15px;
        }

        .texto {
            font-size: 32px;
        }

        .subtexto {
            font-size: 18px;
            margin-top: 12px;
            font-weight: normal;
        }

        .boton:focus {
            outline: 6px solid #ffffff;
            outline-offset: -10px;
        }

        @media (max-width: 600px) {
            .icono {
                font-size: 60px;
            }

            .texto {
                font-size: 26px;
            }

            .subtexto {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <!-- PARTE SUPERIOR: AUDIO -->
    <button class="boton audio" id="botonAudio" onclick="reproducirAudio()">
        <div class="icono">🔊</div>
        <div class="texto">ESCUCHAR INFORMACIÓN</div>
        <div class="subtexto">Pulsa aquí para escuchar el audio</div>
    </button>

    <!-- PARTE INFERIOR: GOOGLE SITES -->
    <a
        class="boton web"
        href="https://sites.google.com/view/nexovideokitwebcom/p%C3%A1gina-principal"
        target="_blank"
        rel="noopener noreferrer">

        <div class="icono">🌐</div>
        <div class="texto">VISITAR PÁGINA WEB</div>
        <div class="subtexto">Pulsa aquí para conocer el Nexo Video Kit</div>
    </a>

    <!-- AUDIO -->
    <audio id="audio" src="audio.mp3" preload="auto"></audio>

    <script>
        const audio = document.getElementById("audio");
        const boton = document.getElementById("botonAudio");

        function reproducirAudio() {

            if (audio.paused) {
                audio.play();
                boton.querySelector(".texto").textContent = "⏸️ PAUSAR INFORMACIÓN";
            } else {
                audio.pause();
                boton.querySelector(".texto").textContent = "ESCUCHAR INFORMACIÓN";
            }
        }

        audio.addEventListener("ended", function() {
            boton.querySelector(".texto").textContent = "ESCUCHAR INFORMACIÓN";
        });
    </script>

</body>
</html>
