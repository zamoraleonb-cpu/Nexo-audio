<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nexo Video Kit - Accesibilidad</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            background: white;
        }

        .boton {
            width: 100%;
            border: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            color: white;
            font-weight: bold;
            padding: 20px;
        }

        .audio {
            height: 60vh;
            background: #111111;
        }

        .web {
            height: 40vh;
            background: #555555;
        }

        .icono {
            font-size: 70px;
            margin-bottom: 15px;
        }

        .texto {
            font-size: 32px;
        }

        .subtexto {
            font-size: 20px;
            margin-top: 12px;
            font-weight: normal;
        }

        .boton:focus {
            outline: 6px solid #ffffff;
            outline-offset: -10px;
        }

        @media (max-width: 600px) {
            .icono {
                font-size: 60px;
            }

            .texto {
                font-size: 25px;
            }

            .subtexto {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <!-- BOTÓN SUPERIOR: AUDIO -->
    <button
        class="boton audio"
        id="botonAudio"
        onclick="reproducirAudio()"
        aria-label="Botón superior. Presiona aquí para escuchar la información del Nexo Video Kit">

        <div class="icono">🔊</div>

        <div class="texto">
            PRESIONA AQUÍ PARA ESCUCHAR LA INFORMACIÓN
        </div>

        <div class="subtexto">
            Botón superior · Reproducir audio
        </div>

    </button>


    <!-- BOTÓN INFERIOR: PÁGINA WEB -->
    <a
        class="boton web"
        href="https://sites.google.com/view/nexovideokitwebcom/p%C3%A1gina-principal"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Botón inferior. Presiona aquí para visitar la página web del Nexo Video Kit">

        <div class="icono">🌐</div>

        <div class="texto">
            PRESIONA AQUÍ PARA VISITAR LA PÁGINA WEB
        </div>

        <div class="subtexto">
            Botón inferior · Conocer el Nexo Video Kit
        </div>

    </a>


    <!-- AUDIO -->
    <audio id="audio" src="audio.mp3" preload="auto"></audio>


    <script>
        const audio = document.getElementById("audio");
        const boton = document.getElementById("botonAudio");

        function reproducirAudio() {

            if (audio.paused) {

                audio.play();

                boton.querySelector(".texto").textContent =
                    "⏸️ PAUSAR INFORMACIÓN";

                boton.querySelector(".subtexto").textContent =
                    "El audio se está reproduciendo";

            } else {

                audio.pause();

                boton.querySelector(".texto").textContent =
                    "PRESIONA AQUÍ PARA ESCUCHAR LA INFORMACIÓN";

                boton.querySelector(".subtexto").textContent =
                    "Botón superior · Reproducir audio";
            }
        }

        audio.addEventListener("ended", function() {

            boton.querySelector(".texto").textContent =
                "PRESIONA AQUÍ PARA ESCUCHAR LA INFORMACIÓN";

            boton.querySelector(".subtexto").textContent =
                "Botón superior · Reproducir audio";
        });
    </script>

</body>
</html>
